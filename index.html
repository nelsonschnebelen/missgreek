<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miss Greek — Beach Bar &amp; Grill · Miami</title>
  <meta name="description" content="Miss Greek · Beach Bar & Grill, Miami. Your Greek summer. All year. Come hungry. Stay late. Yamas." />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Jost:ital,wght@0,300..700;1,300..700&family=Caveat:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body class="page-home">

  <div class="shell">

    <!-- ══════════ LEFT · HERO CARD ══════════ -->
    <section class="stage">
      <div class="stage__media"><img src="images/dome.jpg" alt="Blue domes over the Aegean sea" /></div>
      <div class="stage__grade" aria-hidden="true"></div>
      <canvas class="stage__dust" aria-hidden="true"></canvas>

      <header class="bar">
        <button class="bar__burger" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
        <a class="bar__brand" href="index.html">Miss Greek</a>
        <nav class="bar__links" aria-label="Primary">
          <a href="menu.html">Menu</a>
          <a href="order.html">Order</a>
          <a href="about.html">About</a>
        </nav>
        <a class="bar__cta" href="reservation.html">Book a Table</a>
      </header>

      <nav class="fold" aria-label="Site">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="order.html">Order Online</a>
        <a href="about.html">About</a>
        <a href="reservation.html">Book a Table</a>
        <p class="fold__script">see you at sunset</p>
      </nav>

      <h1 class="stage__title">
        <span data-reveal>Permanent</span>
        <span data-reveal>Summer</span>
      </h1>
      <p class="stage__script" data-reveal>come hungry. stay late. yamas.</p>

      <div class="stage__socials">
        <a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="0.9" fill="currentColor" stroke="none"/></svg></a>
        <a href="#" aria-label="TikTok"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 3c.4 2.1 1.8 3.6 3.9 3.9v3c-1.5 0-2.9-.5-3.9-1.3v6.3c0 3.4-2.4 5.6-5.5 5.6-3 0-5.3-2.2-5.3-5.2 0-2.9 2.2-5.1 5.2-5.1.3 0 .7 0 1 .1v3.1c-.3-.1-.6-.2-1-.2-1.3 0-2.3 1-2.3 2.2 0 1.3 1 2.2 2.4 2.2 1.5 0 2.5-1 2.5-2.7V3h3z"/></svg></a>
        <a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7h2.4l.4-2.9h-2.8V9.2c0-.8.3-1.4 1.5-1.4h1.4V5.2c-.2 0-1.1-.1-2.1-.1-2.1 0-3.6 1.3-3.6 3.7v2.3H8.2V14h2.5v7h2.8z"/></svg></a>
      </div>
    </section>

    <!-- ══════════ RIGHT · SIDE PANEL ══════════ -->
    <aside class="rail">
      <a class="rail__card" href="menu.html" data-reveal>
        <img src="images/food/fish2.jpg" alt="From the sea — the seafood pan" />
        <span class="rail__label">Menu</span>
        <span class="rail__go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
      <a class="rail__card" href="order.html" data-reveal>
        <img src="images/food/pasta-tomato.jpg" alt="Boxed and ready to travel" />
        <span class="rail__label">Order Online</span>
        <span class="rail__go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
      <a class="rail__card" href="reservation.html" data-reveal>
        <img src="images/fine-dining.jpg" alt="A table in the candlelight" />
        <span class="rail__label">Reservation</span>
        <span class="rail__go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
      <a class="rail__card" href="about.html" data-reveal>
        <img src="images/hero-santorini.jpg" alt="White walls over the Aegean — the taverna" />
        <span class="rail__label">Our Taverna</span>
        <span class="rail__go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
    </aside>

  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
